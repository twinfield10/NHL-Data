[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl"
version = "0.2.0"
description = "NHL data pipeline (NHL API -> S3) and expected goals model; base layer for game prediction."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "requests>=2.31",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "xgboost>=2.1",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "fastexcel>=0.11",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# DST prop widget (LowVig/BetOnline props): also run `playwright install chromium`.
browser = ["playwright>=1.57"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.0", "matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
nhl = "nhl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhl = ["reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
